<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<meta name="description" content="VibeNest — una red social web simple, rápida y privada.">
<title>VibeNest</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast" class="toast"></div>
<section id="authView" class="auth-view">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">V</span><div><b>VibeNest</b><small>tu espacio, tus vibes.</small></div></div>
    <div class="auth-tabs"><button type="button" class="active" data-auth="login">Entrar</button><button type="button" data-auth="signup">Crear cuenta</button></div>
    <form id="authForm">
      <label id="displayWrap" class="hidden">Nombre visible<input id="displayName" maxlength="40" autocomplete="name"></label>
      <label>Correo<input id="email" type="email" required autocomplete="email"></label>
      <label>Contraseña<input id="password" type="password" required minlength="6" autocomplete="current-password"></label>
      <label id="usernameWrap" class="hidden">Usuario<input id="username" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="mathi_28"></label>
      <button class="primary wide" type="submit" id="authSubmit">Entrar</button>
    </form>
    <p class="muted center">Al crear una cuenta aceptas las reglas de la comunidad.</p>
  </div>
</section>

<div id="appView" class="hidden">
<header class="topbar">
  <a class="brand" href="#" data-nav="feed"><span class="brand-mark">V</span><div><b>VibeNest</b><small>tu espacio, tus vibes.</small></div></a>
  <div class="search"><span>⌕</span><input id="searchInput" placeholder="Buscar personas..."></div>
  <nav><button data-nav="feed">Inicio</button><button data-nav="notifications">🔔 <i id="notifCount"></i></button><button data-nav="profile">Perfil</button><button id="themeBtn" title="Tema">☾</button><button id="logoutBtn" title="Salir">↪</button></nav>
</header>
<main class="layout">
  <aside class="sidebar card">
    <div id="miniProfile"></div>
    <button class="side-btn active" data-nav="feed">⌂ Inicio</button>
    <button class="side-btn" data-nav="profile">◉ Mi perfil</button>
    <button class="side-btn" data-nav="notifications">♢ Notificaciones</button>
    <button class="side-btn" id="rulesBtn">ⓘ Reglas</button>
  </aside>
  <section id="content"></section>
  <aside class="rightbar">
    <div class="card tips"><h3>VibeNest</h3><p>Comparte cosas, descubre gente y mantén tu espacio tranquilo.</p><button id="rulesBtn2">Ver reglas</button></div>
  </aside>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-close">×</button><div id="modalContent"></div></div></div>
<script>
(function(){
  const toast=document.getElementById("toast");
  const show=(msg)=>{toast.textContent=msg;toast.classList.add("show");};
  const loadScript=(src)=>new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=src;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error("No se pudo cargar "+src));
    document.head.appendChild(s);
  });
  const loadOneOf=async(urls)=>{
    let last=null;
    for(const url of urls){
      try{await loadScript(url);return}catch(e){last=e;}
    }
    throw last||new Error("No se pudo cargar el sistema.");
  };
  async function start(){
    try{
      await loadOneOf([
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js",
        "https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"
      ]);
      if(!window.supabase?.createClient) throw new Error("La librería de Supabase se cargó pero no expuso createClient.");
      await loadScript("config.js");
      await loadScript("app.js");
      if(!window.VIBENEST_APP_READY) throw new Error("VibeNest no terminó de iniciar.");
    }catch(err){
      console.error("VibeNest bootstrap:",err);
      window.VIBENEST_BOOT_ERROR=err?.message||String(err);
      show("No se pudo conectar con VibeNest. Recarga la página. Si sigue igual, el problema es la conexión con Supabase.");
    }
  }
  start();

  document.querySelectorAll("[data-auth]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll("[data-auth]").forEach(x=>x.classList.toggle("active",x===btn));
      const signup=btn.dataset.auth==="signup";
      document.getElementById("displayWrap").classList.toggle("hidden",!signup);
      document.getElementById("usernameWrap").classList.toggle("hidden",!signup);
      document.getElementById("authSubmit").textContent=signup?"Crear cuenta":"Entrar";
    });
  });

  document.getElementById("authForm").addEventListener("submit",e=>{
    if(window.VIBENEST_APP_READY)return;
    e.preventDefault();
    show(window.VIBENEST_BOOT_ERROR
      ? "VibeNest todavía no pudo iniciar. Recarga la página."
      : "VibeNest todavía está cargando. Inténtalo de nuevo en un momento.");
  });
})();
</script>
</body>
</html>

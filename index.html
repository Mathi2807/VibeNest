<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<meta name="description" content="VibeNest — tu espacio social para compartir, descubrir y conversar.">
<title>VibeNest</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast" class="toast"></div>

<section id="authView" class="auth-view">
  <div class="auth-card">
    <div class="auth-hero">
      <div class="brand"><span class="brand-mark">V</span><div><b>VibeNest</b><small>tu espacio, tus vibes.</small></div></div>
      <span class="hero-badge">social • simple • tuyo</span>
    </div>
    <div class="auth-tabs">
      <button type="button" class="active" data-auth="login">Entrar</button>
      <button type="button" data-auth="signup">Crear cuenta</button>
    </div>
    <form id="authForm">
      <label id="displayWrap" class="hidden">Nombre visible<input id="displayName" maxlength="40" autocomplete="name" placeholder="Tu nombre"></label>
      <label>Correo<input id="email" type="email" required autocomplete="email" placeholder="tu@correo.com"></label>
      <label>Contraseña<input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></label>
      <label id="usernameWrap" class="hidden">Usuario<input id="username" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="mathi_28"></label>
      <button class="primary wide auth-submit" type="submit" id="authSubmit">Entrar</button>
    </form>
    <p class="muted center">Al crear una cuenta aceptas las reglas de la comunidad.</p>
  </div>
</section>

<div id="appView" class="hidden">
<header class="topbar">
  <a class="brand top-brand" href="#" data-nav="feed"><span class="brand-mark">V</span><div><b>VibeNest</b><small>tu espacio, tus vibes.</small></div></a>
  <div class="search">
    <span>⌕</span>
    <input id="searchInput" placeholder="Buscar personas, posts o #hashtags" autocomplete="off">
  </div>
  <nav class="top-nav">
    <button class="top-nav-btn" data-nav="explore">Explorar</button>
    <button class="top-nav-btn" data-nav="messages">💬<i class="nav-dot" id="messageDot"></i></button>
    <button class="top-nav-btn" data-nav="notifications">🔔<i id="notifCount"></i></button>
    <button class="top-nav-btn" data-nav="profile">Perfil</button>
    <button id="themeBtn" class="icon-btn" title="Cambiar tema">☾</button>
    <button id="logoutBtn" class="icon-btn" title="Salir">↪</button>
  </nav>
</header>

<main class="layout">
  <aside class="sidebar card">
    <div id="miniProfile"></div>
    <div class="nav-section-title">Tu espacio</div>
    <button class="nav-item active" data-nav="feed">⌂ <span>Inicio</span></button>
    <button class="nav-item" data-nav="explore">⌕ <span>Explorar</span></button>
    <button class="nav-item" data-nav="saved">🔖 <span>Guardados</span></button>
    <button class="nav-item" data-nav="messages">💬 <span>Mensajes</span></button>
    <button class="nav-item" data-nav="groups">👥 <span>Grupos</span></button>
    <button class="nav-item" data-nav="notifications">🔔 <span>Notificaciones</span></button>
    <div class="nav-section-title">Cuenta</div>
    <button class="nav-item" data-nav="profile">◉ <span>Mi perfil</span></button>
    <button class="nav-item" data-nav="settings">⚙ <span>Configuración</span></button>
    <button class="nav-item" id="rulesBtn">ⓘ <span>Reglas</span></button>
  </aside>

  <section id="content"></section>

  <aside class="rightbar">
    <div class="card tips">
      <div class="tips-icon">✦</div>
      <span class="eyebrow">VibeNest</span>
      <h3>Tu red, a tu manera.</h3>
      <p>Comparte, descubre gente y mantén tu espacio tranquilo.</p>
      <button id="rulesBtn2" class="link-btn">Ver reglas</button>
    </div>
    <div class="card quick-card">
      <span class="eyebrow">Atajos</span>
      <button data-nav="messages">💬 Abrir mensajes</button>
      <button data-nav="saved">🔖 Ver guardados</button>
      <button data-nav="settings">⚙ Ajustes</button>
    </div>
  </aside>
</main>

<nav class="mobile-nav">
  <button class="nav-item" data-nav="feed">⌂<small>Inicio</small></button>
  <button class="nav-item" data-nav="explore">⌕<small>Explorar</small></button>
  <button class="mobile-create" data-nav="feed">＋</button>
  <button class="nav-item" data-nav="messages">💬<small>Chats</small></button>
  <button class="nav-item" data-nav="profile">◉<small>Perfil</small></button>
</nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" aria-label="Cerrar">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="supabase-lite.js"></script>
<script src="app.js"></script>
<script>
(function(){
  if(window.VIBENEST_APP_READY)return;
  const toast=document.getElementById("toast");
  if(toast){
    toast.textContent="VibeNest no pudo iniciar correctamente. Recarga la página.";
    toast.classList.add("show");
  }
})();
</script>
</body>
</html>
